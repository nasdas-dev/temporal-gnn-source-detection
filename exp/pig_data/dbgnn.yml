model: dbgnn

eval:
  min_outbreak: 2
  top_k: [1, 3, 5, 10]
  credible_p: [0.80, 0.90]
  inverse_rank_offset: [0]
  n_truth: 1

train:
  n_mc: 5
  reps: 2
  test_size: 0.20
  batch_size: 16
  epochs: 200
  patience: 20
  lr: 0.001
  weight_decay: 0.0005
  seed: 42

dbgnn:
  order: 2
  delta: 24
  bipartite_agg: sum
  hidden_channels: 32
  num_conv_layers: 3
  conv_type: gcn
  dropout_rate: 0.2
