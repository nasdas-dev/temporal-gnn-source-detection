# SIR simulation config — pig_data network (pig transport movements, ~9 years)
#
# Full network: ~12 100 nodes, t_max = 3 286 days. Un-reduced this is far too
# large to simulate — a single n_runs at full size needs ~1 TB per array — so
# this config reduces the network to <=300 nodes and a representative time
# window BEFORE simulation (the same safe_1h reduction the thesis runner
# applies). After reduction, n_runs=5000 / mc_runs=500 (matching every other
# network) is cheap and trains properly.
#
#   python main_tsir.py --cfg exp/pig_data/tsir.yml --data pig_data

nwk:
  type: empirical
  name: pig_data
  t_max: 3286
  directed: true
  reduction:
    enabled: auto
    preset: safe_1h
    runtime_target_s: 3600
    node:
      method: balanced_activity_snowball
      apply_if_nodes_gt: 300
      target_nodes: 300
      max_node_edge_cost: auto_students_div72
      stratification_bins: 4
      seed: 42
      min_nodes: 8
    time:
      method: representative_window
      apply_if_time_steps_gt: 1000
      max_steps_days: 365
      candidate_windows: 32
      reindex_to_zero: true

sir:
  beta: 0.08              # fallback only; overridden by the R0 calibration below
  mu: 0.01                # standardised across the whole test suite
  start_t: 0
  end_t: 3286             # upper bound; calibrated down to the ~40% snapshot
  n_runs: 5000            # ground-truth runs per source (post-reduction)
  mc_runs: 500            # Monte Carlo training runs per source (post-reduction)
  calibration:
    enabled: true
    target_r0: 2.0          # calibrate beta so R0 ~= 2
    target_infected: 0.40   # calibrate end_t so ~40% of nodes are infected
    output_dir: results/calibration
    n_probe: 1
    max_iter: 8
    tolerance: 0.05
    target_infected_n_probe: 64
    target_infected_tolerance: 0.02
    seed: 42
