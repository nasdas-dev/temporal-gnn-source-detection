model: backtracking

# escort is reduced to ~251 nodes before training (small-graph regime like
# olten), not the full 14 783-node graph. Capacity and budget mirror olten;
# num_layers=6 matches the other small networks.
eval:
  min_outbreak: 2       # standardised threshold for model evaluation
  top_k: [1, 3, 5, 10]
  credible_p: [0.80, 0.90]
  inverse_rank_offset: [0]
  n_truth: 333

train:
  n_mc: 500
  reps: 3
  test_size: 0.20
  batch_size: 32
  epochs: 300
  patience: 30
  lr: 0.001
  weight_decay: 0.0001
  seed: 42

backtracking:
  hidden_dim: 32
  num_layers: 6
