eval:
  min_outbreak: 2
  rank_scope: candidate  # rank over observed non-susceptible candidates
  top_k: [1, 3, 5, 10]
  credible_p: [0.80, 0.90]
  inverse_rank_offset: [0]
  n_truth: 1000
  reps: 3
baselines:
  - uniform
  - random
  - degree
  - closeness
  - betweenness
  - jordan_center

baseline_params:
  default:
    chunk_size: 8192
  betweenness:
    normalized: true
