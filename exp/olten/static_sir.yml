nwk:
  name: olten
  directed: false

# Continuous-time SIR (paper's C binary, Sterchi et al. 2025)
# olten: 749 nodes, static-projection mean degree ~= 9.23
# beta = 2*nu/mean_degree ~= 0.22 for R0 ~= 2.0
sir:
  beta: 0.22
  nu:   1.0
  T:    2.0
  n_runs:   1000   # reduced for the 749-node network
  mc_runs:  500

project: source-detection
